name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/ufo-cow-game-763lrm, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The repo may be served from /<repo>/, so Vite needs the matching base.
      - run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"
      # enablement turns Pages on for the repo if it isn't already, so the
      # first run doesn't need anyone to click through repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
